<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open World: Starfall Frontier</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="hud">
        <div>
          <h1>Starfall Frontier</h1>
          <p>Explore the open world, discover landmarks, and chart the frontier.</p>
        </div>
        <div class="stats">
          <div>
            <span class="label">Coordinates</span>
            <span id="coords">0, 0</span>
          </div>
          <div>
            <span class="label">Biome</span>
            <span id="biome">Unknown</span>
          </div>
          <div>
            <span class="label">Discoveries</span>
            <span id="discoveries">0</span>
          </div>
        </div>
        <div class="controls">
          <h2>Controls</h2>
          <ul>
            <li><strong>Move:</strong> WASD / Arrow Keys</li>
            <li><strong>Sprint:</strong> Hold Shift</li>
            <li><strong>Interact:</strong> Space</li>
          </ul>
        </div>
      </section>
      <section class="world">
        <canvas id="game" width="960" height="600" aria-label="Open world canvas"></canvas>
        <div class="overlay">
          <div class="quest-log">
            <h3>Quest Log</h3>
            <ol id="quests"></ol>
          </div>
          <div class="minimap">
            <h3>Map</h3>
            <canvas id="map" width="180" height="180"></canvas>
          </div>
        </div>
      </section>
      <section class="journal">
        <h2>Explorer Journal</h2>
        <div id="journal"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
